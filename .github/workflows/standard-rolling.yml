name: Publish MUX Standard managed release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mux-standard-managed-release
  cancel-in-progress: true

jobs:
  build-standard:
    name: Build, test and publish MUX Standard
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set managed release version
        shell: pwsh
        run: |
          $version = "2.0.$env:GITHUB_RUN_NUMBER"
          "MUX_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "MUX managed release: $version"

      - name: Restore
        run: dotnet restore MUX.sln

      - name: Run deterministic core validation
        run: dotnet run --project tests/MUX.Core.Tests/MUX.Core.Tests.csproj -c Release --no-restore

      - name: Publish MUX Standard
        shell: pwsh
        run: |
          dotnet publish src/MUX.App/MUX.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:Version=$env:MUX_VERSION `
            -p:ContinuousIntegrationBuild=true `
            -o artifacts/MUX
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish dedicated Stream Deck launchers
        shell: pwsh
        run: |
          dotnet publish src/MUX.StreamDeckLauncher/MUX.StreamDeckLauncher.csproj `
            -c Release -r win-x64 --self-contained true -p:PublishAot=true -o artifacts/StreamDeck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $source = Join-Path $PWD "artifacts/StreamDeck/MUX-StreamDeckLauncher.exe"
          if (-not (Test-Path $source)) {
            throw "Native Stream Deck launcher was not produced."
          }

          Copy-Item $source (Join-Path $PWD "artifacts/MUX/MUX-AutoArrange.exe") -Force
          Copy-Item $source (Join-Path $PWD "artifacts/MUX/MUX-BlackBars.exe") -Force
          Copy-Item $source (Join-Path $PWD "artifacts/MUX/MUX-ScreenBars.exe") -Force

      - name: Launch and Stream Deck command smoke test
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "artifacts/MUX/MUX.exe"
          $autoLauncher = Join-Path $PWD "artifacts/MUX/MUX-AutoArrange.exe"
          $barsLauncher = Join-Path $PWD "artifacts/MUX/MUX-BlackBars.exe"
          $screenBarsLauncher = Join-Path $PWD "artifacts/MUX/MUX-ScreenBars.exe"

          foreach ($required in @($exe, $autoLauncher, $barsLauncher, $screenBarsLauncher)) {
            if (-not (Test-Path $required)) {
              throw "Required Standard executable is missing: $required"
            }
          }

          $process = Start-Process -FilePath $exe -ArgumentList "--background" -PassThru
          Start-Sleep -Seconds 5
          $process.Refresh()

          if ($process.HasExited) {
            $log = Join-Path $env:LOCALAPPDATA "MUX/startup-error.log"
            if (Test-Path $log) {
              Write-Host "--- MUX startup-error.log ---"
              Get-Content $log
              Write-Host "-----------------------------"
            }
            throw "MUX Standard exited during startup with exit code $($process.ExitCode)."
          }

          function Test-Launcher([string]$path, [string]$name, [int[]]$allowedExitCodes) {
            $child = Start-Process -FilePath $path -PassThru
            if (-not $child.WaitForExit(16000)) {
              Stop-Process -Id $child.Id -Force -ErrorAction SilentlyContinue
              throw "$name did not return after handing off its command."
            }
            if ($allowedExitCodes -notcontains $child.ExitCode) {
              throw "$name exited with unexpected code $($child.ExitCode)."
            }
            Write-Host "$name returned expected code $($child.ExitCode)."
          }

          # A headless CI desktop may have no eligible normal window. Exit code 6 proves
          # Auto Arrange returned a real execution result rather than only acknowledging a queue.
          Test-Launcher $autoLauncher "MUX-AutoArrange.exe" @(0, 6)
          Test-Launcher $barsLauncher "MUX-BlackBars.exe" @(0)
          Test-Launcher $barsLauncher "MUX-BlackBars.exe second toggle" @(0)
          Test-Launcher $screenBarsLauncher "MUX-ScreenBars.exe" @(0)

          $commandLog = Join-Path $env:LOCALAPPDATA "MUX/streamdeck-command.log"
          if (-not (Test-Path $commandLog)) {
            throw "MUX did not create the Stream Deck command execution log."
          }

          $commandLogText = Get-Content $commandLog -Raw
          if ($commandLogText -notmatch "auto-arrange => (OK|ERROR)") {
            throw "Auto Arrange did not record a real execution outcome."
          }
          if ($commandLogText -notmatch "toggle-black-bars => OK") {
            throw "Black Bars did not record a successful execution outcome."
          }

          foreach ($arguments in @("--auto-arrange", "--toggle-black-bars")) {
            $child = Start-Process -FilePath $exe -ArgumentList $arguments -PassThru
            if (-not $child.WaitForExit(5000)) {
              Stop-Process -Id $child.Id -Force -ErrorAction SilentlyContinue
              throw "MUX.exe $arguments did not return after command handoff."
            }
            if ($child.ExitCode -ne 0) {
              throw "MUX.exe $arguments exited with code $($child.ExitCode)."
            }
          }

          $process.Refresh()
          if ($process.HasExited) {
            throw "The resident MUX process was replaced or terminated by a Stream Deck command."
          }

          Stop-Process -Id $process.Id -Force
          Write-Host "MUX startup and dedicated Stream Deck command paths passed."

      - name: Verify Windows executable branding
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "artifacts/MUX/MUX.exe"
          $sourceIcon = Join-Path $PWD "src/MUX.App/Assets/mux-app.ico"
          if (-not (Test-Path $sourceIcon) -or -not (Test-Path $exe)) {
            throw "MUX application or icon is missing from the release inputs."
          }
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($exe)
          if ($null -eq $icon -or $icon.Width -lt 16) {
            throw "MUX.exe does not expose a usable Windows application icon."
          }
          $icon.Dispose()
          Write-Host "MUX.exe contains a usable Windows icon."

      - name: Package portable build
        shell: pwsh
        run: Compress-Archive -Path artifacts/MUX/* -DestinationPath artifacts/MUX-win-x64.zip -CompressionLevel Optimal

      - name: Install pinned Velopack CLI
        shell: pwsh
        run: |
          $existing = Get-Command vpk -ErrorAction SilentlyContinue
          if ($existing) {
            dotnet tool update -g vpk --version 1.2.161
          } else {
            dotnet tool install -g vpk --version 1.2.161
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $toolPath = Join-Path $env:USERPROFILE ".dotnet\tools"
          $toolPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Prepare previous managed release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Path artifacts/Releases -Force | Out-Null

          & vpk download github `
            --repoUrl "https://github.com/TripleAxisCapital/MUX" `
            --token $env:GITHUB_TOKEN `
            --outputDir artifacts/Releases

          if ($LASTEXITCODE -ne 0) {
            Write-Host "No previous managed MUX release is available yet. Building a full first package."
            $global:LASTEXITCODE = 0
          }

      - name: Build managed MUX installer
        shell: pwsh
        run: |
          Get-ChildItem artifacts/Releases -Filter "*-Setup.exe" -File -ErrorAction SilentlyContinue |
            Remove-Item -Force -ErrorAction SilentlyContinue

          & vpk pack `
            --packId TripleAxisCapital.MUX `
            --packVersion $env:MUX_VERSION `
            --packDir artifacts/MUX `
            --mainExe MUX.exe `
            --packTitle "MUX" `
            --packAuthors "Triple Axis Capital" `
            --icon src/MUX.App/Assets/mux-app.ico `
            --releaseNotes RELEASE_NOTES.md `
            --outputDir artifacts/Releases
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $setup = Get-ChildItem artifacts/Releases -Filter "*-Setup.exe" -File |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1

          if (-not $setup) {
            throw "Velopack completed but did not produce Setup.exe."
          }

          New-Item -ItemType Directory -Path artifacts/installers -Force | Out-Null
          Copy-Item $setup.FullName artifacts/installers/MUX-Standard-Setup-x64.exe -Force

      - name: Publish versioned managed release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          & vpk upload github `
            --repoUrl "https://github.com/TripleAxisCapital/MUX" `
            --token $env:GITHUB_TOKEN `
            --outputDir artifacts/Releases `
            --publish `
            --releaseName "MUX $env:MUX_VERSION" `
            --tag "v$env:MUX_VERSION" `
            --targetCommitish $env:GITHUB_SHA `
            --merge
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Write-Host "Managed release v$env:MUX_VERSION is live. Installed MUX clients can discover it now."

      - uses: actions/upload-artifact@v4
        with:
          name: MUX-Standard-managed
          path: |
            artifacts/MUX-win-x64.zip
            artifacts/installers/MUX-Standard-Setup-x64.exe
          if-no-files-found: error

  publish-standard:
    name: Refresh stable Standard download link
    needs: build-standard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MUX-Standard-managed
          path: release-assets

      - name: Publish current Standard assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view latest-build --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload latest-build \
              release-assets/MUX-win-x64.zip \
              release-assets/installers/MUX-Standard-Setup-x64.exe \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create latest-build \
              release-assets/MUX-win-x64.zip \
              release-assets/installers/MUX-Standard-Setup-x64.exe \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "MUX Latest Windows Builds" \
              --notes "Rolling MUX Windows downloads. MUX Standard uses the managed Velopack installer; MUX Virtual Displays is published by the full driver pipeline." \
              --prerelease
          fi

          echo "MUX Standard rolling asset now matches $GITHUB_SHA"
