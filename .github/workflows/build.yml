name: Build MUX

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-validation:
    name: Core geometry validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Run deterministic geometry checks
        run: dotnet run --project tests/MUX.Core.Tests/MUX.Core.Tests.csproj -c Release

  windows-build:
    name: MUX Standard · Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore MUX.sln
      - name: Build
        run: dotnet build src/MUX.App/MUX.App.csproj -c Release --no-restore
      - name: Publish self-contained app
        run: dotnet publish src/MUX.App/MUX.App.csproj -c Release -r win-x64 --self-contained true -o artifacts/MUX
      - name: Launch smoke test
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "artifacts/MUX/MUX.exe"
          $process = Start-Process -FilePath $exe -ArgumentList "--background" -PassThru
          Start-Sleep -Seconds 5
          $process.Refresh()

          if ($process.HasExited) {
            $log = Join-Path $env:LOCALAPPDATA "MUX/startup-error.log"
            if (Test-Path $log) {
              Write-Host "--- MUX startup-error.log ---"
              Get-Content $log
              Write-Host "-----------------------------"
            }
            throw "MUX exited during the startup smoke test with exit code $($process.ExitCode)."
          }

          Stop-Process -Id $process.Id -Force
          Write-Host "MUX remained alive through the startup smoke test."
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path artifacts/MUX/* -DestinationPath artifacts/MUX-win-x64.zip -CompressionLevel Optimal
      - uses: actions/upload-artifact@v4
        with:
          name: MUX-win-x64
          path: artifacts/MUX-win-x64.zip
          if-no-files-found: error

  virtual-windows-build:
    name: MUX Virtual Displays · Windows x64
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore virtual controller
        run: dotnet restore src/MUX.Virtual.App/MUX.Virtual.App.csproj

      - name: Build virtual controller
        run: dotnet build src/MUX.Virtual.App/MUX.Virtual.App.csproj -c Release --no-restore

      - name: Publish virtual controller
        run: dotnet publish src/MUX.Virtual.App/MUX.Virtual.App.csproj -c Release -r win-x64 --self-contained true -o artifacts/MUX.Virtual

      - name: Restore WDK packages
        shell: pwsh
        run: nuget restore driver/packages.config -PackagesDirectory driver/packages

      - name: Build native bridge and IddCx virtual display driver
        shell: pwsh
        run: |
          $repoRoot = $PWD.Path
          $driverProject = Join-Path $repoRoot "driver/MUX.Virtual.Display/MUX.Virtual.Display.vcxproj"
          $bridgeSource = Join-Path $repoRoot "native/MUX.SwDeviceBridge.cpp"
          $bridgeOutput = Join-Path $repoRoot "artifacts/MUX.Virtual/MUX.SwDeviceBridge.dll"
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio/Installer/vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "Visual Studio locator was not found on the runner."
          }

          $wdkComponentIds = @("Microsoft.Windows.DriverKit", "Component.Microsoft.Windows.DriverKit.BuildTools")
          $vsInstall = $null
          foreach ($componentId in $wdkComponentIds) {
            $candidate = & $vswhere -latest -products * -requires $componentId -property installationPath 2>$null |
              Select-Object -First 1
            if ($candidate) {
              $vsInstall = $candidate
              break
            }
          }

          if (-not $vsInstall) {
            throw "No Visual Studio installation with the Windows Driver Kit component was found."
          }

          $devShellDll = Join-Path $vsInstall "Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
          if (-not (Test-Path $devShellDll)) {
            throw "Visual Studio Developer Shell module was not found at $devShellDll."
          }

          Import-Module $devShellDll
          Enter-VsDevShell -VsInstallPath $vsInstall -DevCmdArguments '-arch=x64 -host_arch=x64'
          Set-Location $repoRoot

          $nativeCl = Join-Path $env:VCToolsInstallDir "bin/Hostx64/x64/cl.exe"
          if (-not (Test-Path $nativeCl)) {
            throw "x64 C++ compiler was not found at $nativeCl."
          }
          if (-not (Test-Path $bridgeSource)) {
            throw "Software Device native bridge source was not found at $bridgeSource."
          }

          Write-Host "Building native Software Device bridge with: $nativeCl"
          & $nativeCl /nologo /LD /EHsc /W4 /WX /MT /DUNICODE /D_UNICODE `
            $bridgeSource /Fe:$bridgeOutput /link swdevice.lib
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if (-not (Test-Path $bridgeOutput)) {
            throw "Native Software Device bridge did not produce MUX.SwDeviceBridge.dll."
          }

          # WDK 28000 x64 builds must use the 64-bit MSBuild host. The 32-bit host
          # causes DPVerifier/InfVerif and PREfast to look for incompatible x86 host DLLs.
          $msbuild = Join-Path $vsInstall "MSBuild/Current/Bin/amd64/MSBuild.exe"
          if (-not (Test-Path $msbuild)) {
            throw "64-bit MSBuild was not found at $msbuild."
          }

          $wdkPackages = Join-Path $repoRoot "driver/packages"
          $requiredWdkTools = @("stampinf.exe", "inf2cat.exe", "signtool.exe", "tracewpp.exe")
          $wdkToolDirs = @()

          foreach ($toolName in $requiredWdkTools) {
            $candidates = Get-ChildItem -Path $wdkPackages -Recurse -File -Filter $toolName -ErrorAction SilentlyContinue

            $tool = $candidates |
              Where-Object { $_.Directory.Name -in @("x64", "amd64") } |
              Select-Object -First 1

            if (-not $tool) {
              $tool = $candidates |
                Where-Object { $_.Directory.Name -eq "x86" } |
                Select-Object -First 1
            }

            if (-not $tool) {
              throw "No x64/amd64/x86 host copy of $toolName was found in the restored WDK/SDK packages."
            }

            $wdkToolDirs += $tool.DirectoryName
            Write-Host "Found WDK tool $toolName at $($tool.FullName)"
          }

          $wdkToolDirs = $wdkToolDirs | Sort-Object -Unique
          $env:PATH = (($wdkToolDirs -join ";") + ";" + $env:PATH)

          $stampInf = Get-Command stampinf.exe -ErrorAction Stop
          if ($stampInf.Source -match "ARM64") {
            throw "Refusing to execute ARM64 stampinf.exe on the x64 build runner: $($stampInf.Source)"
          }

          Write-Host "Using Visual Studio: $vsInstall"
          Write-Host "Using 64-bit MSBuild: $msbuild"
          Write-Host "Using StampInf: $($stampInf.Source)"

          & $msbuild $driverProject /m /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Assemble virtual-display package
        shell: pwsh
        run: |
          $buildRoot = Join-Path $PWD "driver/MUX.Virtual.Display/bin/x64/Release"
          $driverOut = Join-Path $PWD "artifacts/MUX.Virtual/Driver"
          New-Item -ItemType Directory -Path $driverOut -Force | Out-Null

          foreach ($name in @("MUXVirtualDisplay.dll", "MUXVirtualDisplay.inf", "MUXVirtualDisplay.cat")) {
            $candidate = Get-ChildItem $buildRoot -Recurse -Filter $name |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1

            if (-not $candidate) {
              throw "Driver build did not produce $name."
            }

            Copy-Item $candidate.FullName (Join-Path $driverOut $name) -Force
          }

          $catPath = Join-Path $driverOut "MUXVirtualDisplay.cat"
          $signature = Get-AuthenticodeSignature -FilePath $catPath
          if (-not $signature.SignerCertificate) {
            throw "The generated driver catalog does not expose a signing certificate."
          }

          $certPath = Join-Path $driverOut "MUXVirtualDisplay-TestCertificate.cer"
          $certBytes = $signature.SignerCertificate.Export(
            [System.Security.Cryptography.X509Certificates.X509ContentType]::Cert)
          [System.IO.File]::WriteAllBytes($certPath, $certBytes)
          Write-Host "Exported the public driver test certificate to $certPath"

          Copy-Item "docs/VIRTUAL-DISPLAYS.md" "artifacts/MUX.Virtual/VIRTUAL-DISPLAYS.md" -Force

          Compress-Archive `
            -Path artifacts/MUX.Virtual/* `
            -DestinationPath artifacts/MUX-Virtual-win-x64.zip `
            -CompressionLevel Optimal

      - name: Validate virtual-display package
        shell: pwsh
        run: |
          $zip = Join-Path $PWD "artifacts/MUX-Virtual-win-x64.zip"
          if (-not (Test-Path $zip)) {
            throw "Virtual-display ZIP was not created."
          }

          $verifyRoot = Join-Path $env:RUNNER_TEMP "mux-virtual-package-check"
          if (Test-Path $verifyRoot) {
            Remove-Item $verifyRoot -Recurse -Force
          }
          Expand-Archive -Path $zip -DestinationPath $verifyRoot -Force

          $required = @(
            "MUX.Virtual.exe",
            "MUX.SwDeviceBridge.dll",
            "Driver/MUXVirtualDisplay.dll",
            "Driver/MUXVirtualDisplay.inf",
            "Driver/MUXVirtualDisplay.cat",
            "Driver/MUXVirtualDisplay-TestCertificate.cer",
            "VIRTUAL-DISPLAYS.md"
          )

          foreach ($relativePath in $required) {
            $candidate = Join-Path $verifyRoot $relativePath
            if (-not (Test-Path $candidate)) {
              throw "Virtual-display package is incomplete: missing $relativePath."
            }
          }

          $certificate = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2(
            (Join-Path $verifyRoot "Driver/MUXVirtualDisplay-TestCertificate.cer"))
          if ($certificate.HasPrivateKey) {
            throw "The public release must never contain a private signing key."
          }

          Write-Host "MUX Virtual package contains the controller, native Software Device bridge, complete driver package, public test certificate, and setup documentation."

      - uses: actions/upload-artifact@v4
        with:
          name: MUX-Virtual-win-x64
          path: artifacts/MUX-Virtual-win-x64.zip
          if-no-files-found: error

  publish-rolling-windows-downloads:
    name: Publish rolling Windows downloads
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - windows-build
      - virtual-windows-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: MUX-win-x64
          path: release-assets

      - uses: actions/download-artifact@v4
        with:
          name: MUX-Virtual-win-x64
          path: release-assets

      - name: Publish rolling release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view latest-build --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload latest-build \
              release-assets/MUX-win-x64.zip \
              release-assets/MUX-Virtual-win-x64.zip \
              --repo "$GITHUB_REPOSITORY" \
              --clobber

            gh release edit latest-build \
              --repo "$GITHUB_REPOSITORY" \
              --title "MUX Latest Windows Builds" \
              --notes "Two independent Windows downloads from main: MUX Standard (managed monitor regions) and MUX Virtual Displays (IddCx true virtual-monitor architecture). The rolling Virtual build is test-signed for development, includes the native Software Device bridge, and includes only the public test certificate needed for explicit local trust. Retail distribution still requires Microsoft production driver signing."
          else
            gh release create latest-build \
              release-assets/MUX-win-x64.zip \
              release-assets/MUX-Virtual-win-x64.zip \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "MUX Latest Windows Builds" \
              --notes "Two independent Windows downloads from main: MUX Standard (managed monitor regions) and MUX Virtual Displays (IddCx true virtual-monitor architecture). The rolling Virtual build is test-signed for development, includes the native Software Device bridge, and includes only the public test certificate needed for explicit local trust. Retail distribution still requires Microsoft production driver signing." \
              --prerelease
          fi
