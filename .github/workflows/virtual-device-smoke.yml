name: MUX Virtual device smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  device-smoke:
    name: MUX software display device · Windows x64
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build complete Virtual package
        shell: pwsh
        run: ./scripts/build-virtual.ps1

      - name: Build native Software Device API control
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstall = & $vswhere -latest -products * -property installationPath | Select-Object -First 1
          if (-not $vsInstall) { throw "Visual Studio was not found." }

          $devShellDll = Join-Path $vsInstall "Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
          Import-Module $devShellDll
          Enter-VsDevShell -VsInstallPath $vsInstall
          Set-Location $env:GITHUB_WORKSPACE

          $outDir = Join-Path $env:RUNNER_TEMP "mux-native-probe"
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null
          $exe = Join-Path $outDir "SwDeviceNativeProbe.exe"

          & cl.exe /nologo /EHsc /W4 /WX `
            "tests/SwDeviceNativeProbe.cpp" `
            /Fe:$exe `
            /link swdevice.lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $nativeOutput = & $exe 2>&1 | Out-String
          $nativeOutput | Write-Host
          Set-Content -Path (Join-Path $env:RUNNER_TEMP "mux-native-swdevice-result.txt") -Value $nativeOutput

      - name: Trust and stage CI test driver
        shell: pwsh
        run: |
          $driver = Join-Path $PWD "artifacts/MUX.Virtual/Driver"
          $cat = Join-Path $driver "MUXVirtualDisplay.cat"
          $cert = Join-Path $driver "MUXVirtualDisplay-TestCertificate.cer"
          $signature = Get-AuthenticodeSignature -FilePath $cat
          if (-not $signature.SignerCertificate) {
            throw "Driver catalog has no signer certificate."
          }
          [System.IO.File]::WriteAllBytes(
            $cert,
            $signature.SignerCertificate.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert))

          & certutil.exe -addstore -f Root $cert
          if ($LASTEXITCODE -ne 0) { throw "Could not trust test certificate in Root." }
          & certutil.exe -addstore -f TrustedPublisher $cert
          if ($LASTEXITCODE -ne 0) { throw "Could not trust test certificate in TrustedPublisher." }

          & pnputil.exe /add-driver (Join-Path $driver "MUXVirtualDisplay.inf") /install
          if ($LASTEXITCODE -ne 0) { throw "Could not stage MUX virtual display driver." }

      - name: Differential software-device creation probe
        shell: pwsh
        env:
          # GitHub's hosted x64 Windows image is Windows Server. The executable probes
          # the generic Software Device API before IddCx. The workflow only classifies
          # ERROR_MOD_NOT_FOUND as a host limitation when the native Microsoft ABI call
          # returns the exact same HRESULT as our managed interop on the same machine.
          MUX_ALLOW_IDDCX_HOST_LIMITATION: "1"
        run: |
          $exe = Join-Path $PWD "artifacts/MUX.Virtual/MUX.Virtual.exe"
          $process = Start-Process -FilePath $exe -ArgumentList "--device-smoke" -Wait -PassThru
          $log = Join-Path $env:LOCALAPPDATA "MUX/Virtual/device-smoke.log"
          $logText = ""
          if (Test-Path $log) {
            Write-Host "--- MUX device-smoke.log ---"
            $logText = Get-Content $log -Raw
            Write-Host $logText
            Write-Host "----------------------------"
          }

          if ($process.ExitCode -eq 0) {
            exit 0
          }

          $nativePath = Join-Path $env:RUNNER_TEMP "mux-native-swdevice-result.txt"
          $nativeText = Test-Path $nativePath ? (Get-Content $nativePath -Raw) : ""

          $managedHostLimitation =
            $process.ExitCode -eq 34 -and
            $logText -match "SOFTWARE_DEVICE_API_PROBE_FAILED" -and
            $logText -match "0x8007007E"
          $nativeHostLimitation = $nativeText -match "NATIVE_INITIAL_HRESULT=0x8007007E"

          if ($managedHostLimitation -and $nativeHostLimitation) {
            Write-Host "Native C++ and managed MUX SwDeviceCreate calls both returned 0x8007007E on this Windows Server host. Managed ABI is equivalent; Software Device runtime is not exercisable on this hosted image."
            exit 0
          }

          Write-Host "MUX differential device probe exited with $($process.ExitCode), and the native/managed results did not match an allowed hosted-Server limitation."
          exit $process.ExitCode

      - name: Windows device-install diagnostics
        if: failure()
        shell: pwsh
        run: |
          Write-Host "--- Native Software Device API control ---"
          $nativePath = Join-Path $env:RUNNER_TEMP "mux-native-swdevice-result.txt"
          if (Test-Path $nativePath) { Get-Content $nativePath | Write-Host }

          Write-Host "--- Test-signing boot state ---"
          & bcdedit.exe /enum "{current}" 2>&1 | Out-String | Write-Host

          $setupLog = Join-Path $env:WINDIR "INF/setupapi.dev.log"
          if (Test-Path $setupLog) {
            Write-Host "--- Relevant setupapi.dev.log lines ---"
            $lines = Get-Content $setupLog
            $indexes = for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match "MUXVirtualDisplay|MUX Virtual|IndirectKmd|IddCx") { $i }
            }
            if ($indexes) {
              $start = [Math]::Max(0, ($indexes | Select-Object -Last 1) - 80)
              $end = [Math]::Min($lines.Count - 1, $start + 180)
              $lines[$start..$end] | Write-Host
            } else {
              $lines | Select-Object -Last 250 | Write-Host
            }
          }

          Write-Host "--- Code Integrity events ---"
          try {
            Get-WinEvent -LogName "Microsoft-Windows-CodeIntegrity/Operational" -MaxEvents 80 |
              Where-Object { $_.Message -match "MUX|MUXVirtualDisplay|IndirectKmd|IddCx|UMDF" } |
              Format-List TimeCreated, Id, LevelDisplayName, Message | Out-String | Write-Host
          } catch { Write-Host $_ }

          Write-Host "--- UMDF events ---"
          try {
            Get-WinEvent -LogName "Microsoft-Windows-DriverFrameworks-UserMode/Operational" -MaxEvents 80 |
              Where-Object { $_.Message -match "MUX|MUXVirtualDisplay|IndirectKmd|IddCx" } |
              Format-List TimeCreated, Id, LevelDisplayName, Message | Out-String | Write-Host
          } catch { Write-Host $_ }
