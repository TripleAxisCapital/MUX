name: Build MUX

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-validation:
    name: Core geometry validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Run deterministic geometry checks
        run: dotnet run --project tests/MUX.Core.Tests/MUX.Core.Tests.csproj -c Release

  windows-build:
    name: Windows x64 build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore MUX.sln
      - name: Build
        run: dotnet build src/MUX.App/MUX.App.csproj -c Release --no-restore
      - name: Publish self-contained app
        run: dotnet publish src/MUX.App/MUX.App.csproj -c Release -r win-x64 --self-contained true -o artifacts/MUX
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path artifacts/MUX/* -DestinationPath artifacts/MUX-win-x64.zip -CompressionLevel Optimal
      - uses: actions/upload-artifact@v4
        with:
          name: MUX-win-x64
          path: artifacts/MUX-win-x64.zip
          if-no-files-found: error
      - name: Publish rolling Windows download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest-build --repo "$env:GITHUB_REPOSITORY" *> $null
          $releaseExists = $LASTEXITCODE -eq 0

          if ($releaseExists) {
            gh release upload latest-build artifacts/MUX-win-x64.zip --repo "$env:GITHUB_REPOSITORY" --clobber
            gh release edit latest-build --repo "$env:GITHUB_REPOSITORY" --title "MUX Latest Windows Build" --notes "Latest validated MUX Windows x64 build from main."
          } else {
            gh release create latest-build artifacts/MUX-win-x64.zip --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "MUX Latest Windows Build" --notes "Latest validated MUX Windows x64 build from main." --prerelease
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest-build "$env:GITHUB_SHA"
          git push origin refs/tags/latest-build --force
